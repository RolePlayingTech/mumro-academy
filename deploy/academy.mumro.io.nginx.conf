# Nginx configuration for academy.mumro.io (Hetzner static release hosting)
map $http_accept_language $mumro_academy_browser_language {
    default en;
    "~*^pl(?:-[a-z0-9-]+)?\s*;\s*q=0(?:\.0*)?(?:\s*,|$)" en;
    "~*^pl(?:-[a-z0-9-]+)?(?:\s*[,;]|$)" pl;
}
map $cookie_mumro_lang $mumro_academy_saved_language {
    default $mumro_academy_browser_language;
    en en;
    pl pl;
}
map $arg_lang $mumro_academy_language {
    default $mumro_academy_saved_language;
    en en;
    pl pl;
}
map $arg_lang $mumro_academy_language_cookie {
    default "";
    en "mumro_lang=en; Path=/; Max-Age=31536000; Secure; SameSite=Lax";
    pl "mumro_lang=pl; Path=/; Max-Age=31536000; Secure; SameSite=Lax";
}

server {
    listen 80;
    server_name academy.mumro.io;
    return 308 https://academy.mumro.io$request_uri;
}

server {
    listen 443 ssl;
    server_name academy.mumro.io;
    root /var/www/mumro.io/academy/current/public;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    ssl_certificate /etc/letsencrypt/live/academy.mumro.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academy.mumro.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Set-Cookie $mumro_academy_language_cookie always;
    error_page 404 /404.html;

    location = / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Set-Cookie $mumro_academy_language_cookie always;
        add_header Vary "Accept-Language, Cookie" always;
        add_header Cache-Control "private, no-store" always;
        if ($mumro_academy_language = pl) { return 302 /pl/$is_args$args; }
        try_files /index.html =404;
    }

    location = /index.html { return 308 /$is_args$args; }

    location ^~ /_astro/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /media/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
