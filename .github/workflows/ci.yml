name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Preview regenerated mcp-surface-kit lockfile for Issue 28
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo '=== LOCKFILE DIFF START ==='
          git diff -- package-lock.json
          echo '=== LOCKFILE DIFF END ==='

      - name: Install dependencies
        run: npm ci

      - name: Check agent harness (AGENTS.md, CLAUDE.md, skills match .harness/spec.json)
        run: npx agent-harness check . --strict

      - name: Type and Astro check
        run: npm run check

      - name: Build static site and verify SEO contracts
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm test
